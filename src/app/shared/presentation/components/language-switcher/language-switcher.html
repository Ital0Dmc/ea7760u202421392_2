<mat-button-toggle-group [value]="currentLang" [attr.aria-label]="'toolbar.language' | translate">
  @for (language of languages; track language) {
    <mat-button-toggle [value]="language" (click)="useLanguage(language)" [attr.aria-label]="language">
      {{ language.toUpperCase() }}
    </mat-button-toggle>
  }
</mat-button-toggle-group>
